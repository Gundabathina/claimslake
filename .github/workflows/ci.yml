# ClaimsLake CI
# --------------------------------------------------------------------------
# Runs the PySpark Silver test suite on every push to main and on every pull
# request. PySpark needs a JVM, so we set up Temurin JDK 17 (matches the
# docker/Dockerfile runtime). PySpark itself is not in requirements.txt (that
# file covers the Bronze ingestion layer), so it is installed explicitly here
# at the same version the container uses.
# --------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyspark-tests:
    name: PySpark Silver tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up JDK 17 (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyspark==4.0.0
          pip install -e .

      - name: Run PySpark Silver tests
        run: python -m pytest tests/pyspark -v
